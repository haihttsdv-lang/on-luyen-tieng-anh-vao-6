name: Deploy to GitHub Pages

# Đưa ứng dụng lên một địa chỉ web cố định (thay vì mở file .html tải về) —
# giải quyết triệt để việc mất tiến trình do localStorage bị tách theo từng
# bản file khi mở qua file:// (xem trao đổi trong phiên làm việc dẫn tới
# workflow này). Build ở chế độ "online" (đóng gói 1 file, dùng HashRouter,
# xem vite.config.ts + src/app/router.tsx) nên không cần cấu hình base path
# hay rewrite rule nào cho GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:online
        env:
          # Đồng bộ nhiều thiết bị (tùy chọn, xem README.md) — chỉ hoạt động
          # trên bản deploy nếu 6 secret này được cấu hình ở Settings →
          # Secrets and variables → Actions. Bỏ trống thì build vẫn thành
          # công bình thường, chỉ là tính năng đồng bộ không bật được.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-online

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
